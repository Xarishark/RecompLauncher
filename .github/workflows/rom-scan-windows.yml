name: Windows ROM scanner validation

on:
  push:
    branches: [ci/rom-scan-windows]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Rust
        run: rustup default stable-x86_64-pc-windows-msvc
      - name: Run ROM scanner tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib roms::tests::
      - name: Install frontend tooling
        run: npm ci
      - name: Build Windows installer
        run: npm run build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: recomplauncher-rom-scan-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
